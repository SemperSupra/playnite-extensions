name: Playnite 10.62 Native RDTE Probe

on:
  pull_request:
    paths:
      - ".github/workflows/playnite-runtime-probe.yml"
      - "tooling/rdte/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Probe pinned Playnite runtime and native extension lifecycle
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "playnite-runtime-evidence"
          ./tooling/rdte/probe-playnite-runtime.ps1 `
            -ManifestPath ./tooling/rdte/playnite-10.62.json `
            -EvidenceDir $evidence `
            -ExerciseTemplateLifecycle `
            -ExerciseFixtureSeeder

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playnite-runtime-10.62-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playnite-runtime-evidence
          if-no-files-found: error
          retention-days: 7
