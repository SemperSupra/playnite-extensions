name: Media Library Enrichment Native RDTE

on:
  pull_request:
    paths:
      - "plugins/media-library-enrichment/**"
      - ".github/workflows/playnite-media-library-enrichment-rdte.yml"
      - "tooling/rdte/**"
  push:
    branches:
      - main
    paths:
      - "plugins/media-library-enrichment/**"
      - ".github/workflows/playnite-media-library-enrichment-rdte.yml"
      - "tooling/rdte/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Materialize deterministic Playnite fixture
        env:
          RDTE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RDTE_TRIGGER_SHA: ${{ github.sha }}
          RDTE_PRODUCT_AUTHORITY_SHA: e5c9e7a125910dabdacd734eee1f49abcd8937bf
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "media-library-enrichment-rdte"
          $runtimeEvidence = Join-Path $evidence "runtime"
          ./tooling/rdte/probe-playnite-runtime.ps1 `
            -ManifestPath ./tooling/rdte/playnite-10.62.json `
            -EvidenceDir $runtimeEvidence `
            -ExerciseFixtureSeeder `
            -FixtureProfile media-raw-v1

          $workRoots = @(
            Get-ChildItem $env:RUNNER_TEMP -Directory -Filter "playnite-runtime-*" |
              Sort-Object LastWriteTimeUtc -Descending
          )
          if ($workRoots.Count -lt 1) {
            throw "Unable to locate the disposable Playnite work root."
          }

          $workRoot = $workRoots[0].FullName

          $metadataUtilitiesPackage = Join-Path $env:RUNNER_TEMP "MetadataUtilities_485ab5f0-bfb1-4c17-93cc-20d8338673be_1_9_0.pext"
          Invoke-WebRequest -Uri "https://github.com/HerrKnarz/Playnite-Extensions/releases/download/2026-09-29/MetadataUtilities_485ab5f0-bfb1-4c17-93cc-20d8338673be_1_9_0.pext" -OutFile $metadataUtilitiesPackage
          $metadataUtilitiesSha256 = (Get-FileHash -Path $metadataUtilitiesPackage -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadataUtilitiesSha256 -ne "8b5c3ce5b5aeb3eb1d476083f36aaa5fa58498d3f366666b7ddc56cc40400cf8") {
            throw "Pinned Metadata Utilities package SHA-256 mismatch."
          }

          ./tooling/rdte/qualify-media-library-enrichment.ps1 `
            -WorkRoot $workRoot `
            -EvidenceDir (Join-Path $evidence "media-library-enrichment") `
            -KeepInstalledForConflict

          ./tooling/rdte/qualify-media-library-enrichment-menu.ps1 `
            -WorkRoot $workRoot `
            -EvidenceDir (Join-Path $evidence "media-library-enrichment")

          ./tooling/rdte/qualify-media-library-enrichment-conflict.ps1 `
            -WorkRoot $workRoot `
            -EvidenceDir (Join-Path $evidence "media-library-enrichment") `
            -MetadataUtilitiesPackage $metadataUtilitiesPackage

          ./tooling/rdte/qualify-media-library-enrichment-scale.ps1 `
            -WorkRoot $workRoot `
            -EvidenceDir (Join-Path $evidence "media-library-enrichment")

      - name: Upload Media Library Enrichment RDTE evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: media-library-enrichment-rdte-${{ github.run_attempt }}
          path: ${{ runner.temp }}/media-library-enrichment-rdte
          if-no-files-found: error
          retention-days: 7
